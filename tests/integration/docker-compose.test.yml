# Integration test stack: MariaDB with a seeded Issabel-like schema + PostgreSQL.
#
#   docker compose -f tests/integration/docker-compose.test.yml up -d --wait
#   export CCMON_IT_MYSQL_URL="mysql://ccmon_it:ccmon_it@127.0.0.1:3307"
#   export CCMON_IT_PG_URL="postgresql+psycopg://ccmon_it:ccmon_it@127.0.0.1:5433/ccmon_it"
#   pytest tests/integration
#   docker compose -f tests/integration/docker-compose.test.yml down -v
#
# Without the env vars the tests skip (reported as skipped, never as passed).

services:
  mariadb:
    image: mariadb:10.6
    environment:
      MARIADB_ROOT_PASSWORD: ccmon_it_root
      MARIADB_DATABASE: asteriskcdrdb
      MARIADB_USER: ccmon_it
      MARIADB_PASSWORD: ccmon_it
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 24

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ccmon_it
      POSTGRES_USER: ccmon_it
      POSTGRES_PASSWORD: ccmon_it
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccmon_it"]
      interval: 5s
      timeout: 3s
      retries: 24
