[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccmon"
version = "0.1.0"
description = "Hardened monitoring layer for Issabel / Asterisk call-center operations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "PyMySQL>=1.1",
    "argon2-cffi>=23.1",
    "psycopg[binary]>=3.1",
]

[project.scripts]
ccmon = "ccmon.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "sqlglot>=25"]

[tool.setuptools.packages.find]
include = ["ccmon*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]  # repo root importable even when invoked as bare `pytest`
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "dashboard", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
