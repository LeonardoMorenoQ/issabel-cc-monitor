# /etc/httpd/conf.d/ccmon.conf
# Expose the loopback-only ccmon app under https://<pbx>/ccmon/
# Requires mod_proxy + mod_proxy_http (present in Issabel httpd).
#
# The dashboard is built with relative asset URLs (vite base "./"), so the
# proxy may strip the /ccmon/ prefix safely.

ProxyRequests Off

# Canonical URL with trailing slash: without it, relative asset URLs in
# index.html would resolve against the server root instead of /ccmon/.
Redirect permanent /ccmon /ccmon/

ProxyPass        /ccmon/ http://127.0.0.1:8080/
ProxyPassReverse /ccmon/ http://127.0.0.1:8080/

# Optional hardening: only allow panel/CNO networks if you know them.
# <Location /ccmon/>
#     Require ip 10.0.0.0/8 192.168.0.0/16
# </Location>
